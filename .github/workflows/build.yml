# Builds every machine in ./hosts and pushes the results to Cachix, so the
# machines download instead of compiling.
#
#   prepare  - (weekly: nix flake update), list hosts and their slow packages
#   heavy    - one parallel job per slow package (ci.heavyPackages, see modules/ci.nix)
#   build    - one job per host: the full system; slow packages come from Cachix
#   commit   - weekly: commit the new flake.lock if every host built
#
# Every job pushes each compiled package to Cachix as soon as it's built
# (unfree packages and anything depending on them are never pushed).
#
# Setup (once):
#   - repo variable  CACHIX_CACHE      = your cache name   (Settings > Secrets and variables > Actions > Variables)
#   - repo secret    CACHIX_AUTH_TOKEN = a cachix auth token (... > Secrets)
name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      update:
        description: Update flake inputs first
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
      heavy: ${{ steps.list.outputs.heavy }}
      updated: ${{ steps.update.outputs.updated }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        id: update
        if: github.event_name == 'schedule' || inputs.update
        run: |
          nix flake update
          if git diff --quiet flake.lock; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
            git diff flake.lock
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock

      - name: List hosts and slow packages
        id: list
        run: |
          echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"
          heavy=$(nix eval --json .#nixosConfigurations --apply '
            cs: builtins.concatLists (map (host:
              map (pkg: { inherit host pkg; })
                (builtins.attrNames cs.${host}.config.ci.heavyPackages))
              (builtins.attrNames cs))')
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "$heavy" | jq -r '.[] | "\(.host): \(.pkg)"'

  heavy:
    needs: prepare
    if: needs.prepare.outputs.heavy != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.heavy) }}
    name: heavy (${{ matrix.host }} / ${{ matrix.pkg }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flake-lock

      # ccache: object files from earlier runs of this package (only used by
      # packages wrapped with ccache, see hosts/*/ccache.nix)
      - name: Prepare ccache folder
        run: sudo mkdir -p /var/cache/ccache && sudo chown "$USER" /var/cache/ccache
      - uses: actions/cache/restore@v4
        with:
          path: /var/cache/ccache
          key: ccache-${{ matrix.host }}-${{ matrix.pkg }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ matrix.host }}-${{ matrix.pkg }}-
      - name: Let Nix builds use the ccache folder
        run: sudo chmod -R a+rwX /var/cache/ccache && du -sh /var/cache/ccache

      - uses: ./.github/actions/setup
        with:
          host: ${{ matrix.host }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}

      - name: Build ${{ matrix.pkg }}
        run: nix build --option log-lines 200 .#nixosConfigurations.${{ matrix.host }}.config.ci.heavyPackages.${{ matrix.pkg }}

      - uses: ./.github/actions/finish-push
        if: always()
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # save even if the build failed: the object files that did compile
      # make the retry faster
      - name: Prepare ccache for saving
        id: ccache
        if: always()
        run: |
          sudo chmod -R a+rX /var/cache/ccache
          du -sh /var/cache/ccache
          if [ -n "$(ls -A /var/cache/ccache)" ]; then echo "save=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@v4
        if: always() && steps.ccache.outputs.save == 'true'
        with:
          path: /var/cache/ccache
          key: ccache-${{ matrix.host }}-${{ matrix.pkg }}-${{ github.run_id }}-${{ github.run_attempt }}

  build:
    needs: [prepare, heavy]
    # also run if a heavy job failed: what did build is in the cache, and the
    # failure then shows up here with the full system's context
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.prepare.outputs.hosts) }}
    name: build (${{ matrix.host }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - uses: ./.github/actions/setup
        with:
          host: ${{ matrix.host }}
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}

      - name: Build ${{ matrix.host }}
        run: nix build --option log-lines 200 .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

      - uses: ./.github/actions/finish-push
        if: always()
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

  commit:
    needs: [prepare, build]
    if: needs.prepare.outputs.updated == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flake-lock
      - name: Commit flake.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "flake.lock: update"
          git push
