# Builds the installer ISO (installer/) and publishes it at
#   https://nix.zoe.dev.br/nixos-zoe-installer.iso   (vps-main, Caddy)
# Boot it: the graphical installer starts (installer/gui.py, driving install-nixos.sh).
#
# Upload: the runner joins the tailnet as an ephemeral tag:ci device (Tailscale
# OAuth client; the tailnet policy only lets tag:ci reach servers' SSH) and
# rsyncs to deploy@vps-main, whose key may only write into /srv/nix (rrsync).
#
# Secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, DEPLOY_SSH_KEY.
#
# The ISO clones the latest config from GitHub at install time, so it only
# needs rebuilding when installer/ changes (or for a newer kernel on it).
name: Installer ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "installer/**"
      - "pkgs/artwork.nix"
      - ".github/workflows/iso.yml"
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "pkgs/artwork.nix"
      - ".github/workflows/iso.yml"

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31

      - name: Build ISO
        run: |
          nix build --option log-lines 200 .#installer-iso
          iso=$(find -L result/iso -name '*.iso' | head -1)
          mkdir upload
          cp "$iso" upload/nixos-zoe-installer.iso
          (cd upload && sha256sum nixos-zoe-installer.iso > nixos-zoe-installer.iso.sha256)
          ls -lh upload/

      - name: Build network-boot image
        run: |
          nix build --option log-lines 200 -o result-netboot .#installer-netboot
          mkdir upload/netboot
          cp -L result-netboot/bzImage result-netboot/initrd result-netboot/netboot.ipxe upload/netboot/
          (cd upload/netboot && sha256sum bzImage initrd netboot.ipxe > SHA256SUMS)
          ls -lh upload/netboot/

      - uses: tailscale/github-action@v4
        if: github.event_name != 'pull_request'
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Upload to vps-main
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy)
          # vps-main's host key, pinned (from ssh-keyscan over the tailnet)
          echo 'vps-main ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMFaZTj1K9MZNxCrqQY+5xi3F2irGo9hoZiL5ALBlZph' > ~/.ssh/known_hosts
          ssh_cmd="ssh -i $HOME/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
          # the ISO first (temp name on the server, renamed when complete), then its checksum
          rsync -e "$ssh_cmd" --partial --delay-updates upload/nixos-zoe-installer.iso deploy@vps-main:/
          rsync -e "$ssh_cmd" upload/nixos-zoe-installer.iso.sha256 deploy@vps-main:/
          # netboot: kernel + initrd first, the iPXE script (which names them) last
          rsync -e "$ssh_cmd" -r --partial --delay-updates --exclude netboot.ipxe upload/netboot/ deploy@vps-main:netboot/
          rsync -e "$ssh_cmd" upload/netboot/netboot.ipxe deploy@vps-main:netboot/
          rm -f ~/.ssh/deploy

      - name: Check the download
        if: github.event_name != 'pull_request'
        run: |
          want=$(cut -d' ' -f1 upload/nixos-zoe-installer.iso.sha256)
          got=$(curl -fsSL https://nix.zoe.dev.br/nixos-zoe-installer.iso.sha256 | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "checksum on nix.zoe.dev.br doesn't match ($got)"; exit 1; }
          size=$(curl -fsSI https://nix.zoe.dev.br/nixos-zoe-installer.iso | awk 'tolower($1)=="content-length:"{print $2}' | tr -d '\r')
          echo "Published https://nix.zoe.dev.br/nixos-zoe-installer.iso ($((size / 1048576)) MB, sha256 $want)"
          curl -fsSL https://nix.zoe.dev.br/netboot/SHA256SUMS | diff - upload/netboot/SHA256SUMS \
            || { echo "netboot files on nix.zoe.dev.br don't match"; exit 1; }
          curl -fsSL https://nix.zoe.dev.br/netboot/netboot.ipxe | diff - upload/netboot/netboot.ipxe
          echo "Published https://nix.zoe.dev.br/netboot/ (bzImage, initrd, netboot.ipxe)"
