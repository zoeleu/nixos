name: Finish pushing to Attic
description: >
  Stops `attic watch-store` (started by ./.github/actions/setup) and pushes
  the build result's closure, in case anything was missed. Run with
  `if: always()` so packages that finished are kept even when the build failed.

runs:
  using: composite
  steps:
    - name: Finish pushing to Attic
      if: always() && env.ATTIC_PUSHING == '1'
      shell: bash
      run: |
        echo "::group::Live pushes (attic watch-store)"; cat /tmp/attic-watch.log || true; echo "::endgroup::"
        # Final pass: the result's closure (already-cached and cache.nixos.org paths are skipped)
        if [ -e result ]; then attic push zoe:nixos ./result; fi
        kill "$(cat /tmp/attic-watch.pid)" 2>/dev/null || true
