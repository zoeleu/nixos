name: Set up Nix for a host
description: >
  Frees disk space, installs Nix with the host's binary caches, finds the
  host's unfree packages, and starts pushing compiled packages to Cachix as
  soon as each one finishes.

inputs:
  host:
    description: Name of the host in nixosConfigurations
    required: true
  cachix-cache:
    description: Cachix cache name (empty = don't use Cachix)
    default: ""
  cachix-token:
    description: Cachix auth token
    default: ""
  push:
    description: Push builds to Cachix ("true"/"false")
    default: "true"

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
        df -h /

    - uses: cachix/install-nix-action@v31

    - name: Use the host's binary caches, queue what gets compiled
      shell: bash
      env:
        HOST: ${{ inputs.host }}
      run: |
        cfg=".#nixosConfigurations.$HOST.config.nix.settings"
        subs=$(nix eval --raw "$cfg.substituters" --apply 'builtins.concatStringsSep " "')
        keys=$(nix eval --raw "$cfg.trusted-public-keys" --apply 'builtins.concatStringsSep " "')
        # Runs after every *local* build (not downloads): queue its outputs
        printf '#!/bin/sh\necho "$OUT_PATHS" | tr " " "\\n" >> /tmp/built-paths\n' | sudo tee /etc/nix/record-built
        sudo chmod 755 /etc/nix/record-built
        sudo touch /tmp/built-paths; sudo chmod 666 /tmp/built-paths
        {
          echo "extra-substituters = $subs"
          echo "extra-trusted-public-keys = $keys"
          echo "post-build-hook = /etc/nix/record-built"
        } | sudo tee -a /etc/nix/nix.conf
        sudo systemctl restart nix-daemon

    # Unfree software (Steam, claude-code, ...) may not be redistributed, so
    # it (and anything depending on it) never goes to the public cache.
    - name: Find unfree packages
      shell: bash
      env:
        HOST: ${{ inputs.host }}
      run: |
        names=$(nix eval --impure --raw --file ci/unfree-names.nix 2>&1 >/dev/null \
          | sed -n 's/^trace: UNFREE //p' | sort -u)
        echo "Unfree (never pushed):"; echo "$names"
        if [ -z "$names" ]; then
          filter='^$'
        else
          alt=$(echo "$names" | sed 's/[][\.*^$+?(){}|]/\\&/g' | paste -sd'|')
          filter="^/nix/store/[a-z0-9]{32}-($alt)(-[0-9][^/]*)?$"
        fi
        echo "UNFREE_FILTER=$filter" >> "$GITHUB_ENV"

    # Installs cachix and adds our cache as a download source
    - uses: cachix/cachix-action@v16
      if: inputs.cachix-cache != ''
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-token }}
        skipPush: true

    - name: Push packages to Cachix as soon as they're built
      if: inputs.cachix-cache != '' && inputs.push == 'true'
      shell: bash
      env:
        CACHE: ${{ inputs.cachix-cache }}
        CACHIX_AUTH_TOKEN: ${{ inputs.cachix-token }}
      run: |
        nohup bash ci/push-built.sh /tmp/built-paths "$CACHE" "$UNFREE_FILTER" > /tmp/pusher.log 2>&1 &
        echo $! > /tmp/pusher.pid
        echo "CACHIX_PUSHING=1" >> "$GITHUB_ENV"
