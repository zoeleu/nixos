name: Set up Nix for a host
description: >
  Frees disk space, installs Nix with the host's binary caches (incl. our
  private Attic cache), joins the tailnet, and starts pushing every new
  store path to Attic as soon as it appears (`attic watch-store`).

inputs:
  host:
    description: Name of the host in ciConfigurations
    required: true
  attic-token:
    description: Attic token (push+pull on cache "nixos"); empty = no Attic
    default: ""
  ts-oauth-client-id:
    description: Tailscale OAuth client ID (tag:ci), to reach vps-main for uploads
    default: ""
  ts-oauth-secret:
    description: Tailscale OAuth client secret
    default: ""
  push:
    description: Push builds to Attic ("true"/"false")
    default: "true"

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
        df -h /

    - uses: cachix/install-nix-action@v31

    - name: Use the host's binary caches
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        ATTIC_TOKEN: ${{ inputs.attic-token }}
      run: |
        cfg=".#ciConfigurations.$HOST.config.nix.settings"
        subs=$(nix eval --raw "$cfg.substituters" --apply 'builtins.concatStringsSep " "')
        keys=$(nix eval --raw "$cfg.trusted-public-keys" --apply 'builtins.concatStringsSep " "')
        # Attic is private: downloads from cache.zoe.dev.br need the token
        if [ -n "$ATTIC_TOKEN" ]; then
          printf 'machine cache.zoe.dev.br\npassword %s\n' "$ATTIC_TOKEN" | sudo tee /etc/nix/netrc >/dev/null
          sudo chmod 600 /etc/nix/netrc
        fi
        # ccache folder for packages wrapped with ccache (see hosts/*/ccache.nix);
        # the workflow restores/saves it with actions/cache
        sudo mkdir -p /var/cache/ccache; sudo chmod a+rwx /var/cache/ccache
        {
          echo "extra-substituters = $subs"
          echo "extra-trusted-public-keys = $keys"
          echo "netrc-file = /etc/nix/netrc"
          echo "extra-sandbox-paths = /var/cache/ccache"
        } | sudo tee -a /etc/nix/nix.conf
        sudo systemctl restart nix-daemon

    # Uploads go over the tailnet straight to vps-main: Cloudflare (in front
    # of cache.zoe.dev.br) rejects request bodies over 100 MB
    - uses: tailscale/github-action@v4
      if: inputs.attic-token != '' && inputs.push == 'true'
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci

    - name: Push packages to Attic as soon as they appear
      if: inputs.attic-token != '' && inputs.push == 'true'
      shell: bash
      env:
        ATTIC_TOKEN: ${{ inputs.attic-token }}
      run: |
        nix profile add nixpkgs#attic-client 2>/dev/null || nix profile install nixpkgs#attic-client
        attic login zoe http://vps-main:8090 "$ATTIC_TOKEN"
        # Paths signed by cache.nixos.org are skipped (cache upstream key)
        nohup attic watch-store zoe:nixos > /tmp/attic-watch.log 2>&1 &
        echo $! > /tmp/attic-watch.pid
        echo "ATTIC_PUSHING=1" >> "$GITHUB_ENV"
